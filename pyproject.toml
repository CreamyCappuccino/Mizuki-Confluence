[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizuki-confluence"
version = "0.2.0"
description = "Confluence presentation and Pressroom destination release adapters"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.scripts]
confluence-release = "confluence_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["confluence_pressroom*", "confluence_release*"]
